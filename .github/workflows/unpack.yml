name: Unpack Laravel source

on:
  push:
    paths:
      - family_quest_render_source_v2.zip
      - .github/workflows/unpack.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application
        run: |
          unzip -o family_quest_render_source_v2.zip
          rm family_quest_render_source_v2.zip
          rm .github/workflows/unpack.yml
      - name: Commit application files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Unpack Laravel application source'
          git push
